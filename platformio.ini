; PlatformIO Project Configuration File
;
; Lite Ground Station — ESP32-S3 800x480 RGB ground station.
;
; One [env] per supported display board. Shared settings live in [common];
; each env adds only what differs (board, board flag, memory/partitions).
; To add a new board:
;   1) add a board header under src/board/boards/ (a constexpr BoardConfig),
;   2) select it in src/board/ActiveBoard.h via a -D BOARD_* flag,
;   3) add an [env:...] below that defines that flag.
;
; See docs: https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
boards_dir = .
default_envs = esp32-s3-devkitc-1-myboard

[common]
; Pin to the classic Espressif32 platform (Arduino core 2.0.x). The machine's
; default unversioned `espressif32` resolves to the pioarduino fork (55.x) whose
; builder expects pioarduino-build.py, which the pinned 2.0.3 core does not ship.
platform = espressif32@6.9.0
framework = arduino
platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32#2.0.3
; Regenerates src/ui/gen/UiGen.h from ui/ui_schema.json before every build.
extra_scripts = pre:tools/gen_ui.py
build_flags =
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D LV_CONF_INCLUDE_SIMPLE
	-D CORE_DEBUG_LEVEL=3
	-std=gnu++17
	-I ./include
	-I ./src
build_unflags =
	-std=gnu++11
lib_deps =
	lvgl/lvgl@8.3.6
	moononournation/GFX Library for Arduino@1.2.8
	lovyan03/LovyanGFX@^1.1.12
	adafruit/Adafruit GFX Library@^1.11.9
	tamctec/TAMC_GT911@^1.0.2
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ── Elecrow CrowPanel ESP32-S3 5.0" (default) ───────────────────────────────
; 8 MB flash, 8 MB PSRAM. Custom board JSON in repo root.
[env:esp32-s3-devkitc-1-myboard]
extends = common
board = esp32-s3-devkitc-1-myboard
build_flags = ${common.build_flags} -D BOARD_CROWPANEL_5_0
; Two OTA slots so firmware can be updated over WiFi (see src/net/OtaWebService).
board_build.partitions = partitions_ota_4mb.csv
; To upload over WiFi instead of USB, uncomment and set the board's IP
; (alternatively just open http://<board-ip>/ and upload firmware.bin there):
; upload_protocol = custom
; upload_command = curl -F "firmware=@.pio/build/esp32-s3-devkitc-1-myboard/firmware.bin" http://192.168.3.50/update

; ── GUITION JC8048W550 ESP32-S3 5.0" ────────────────────────────────────────
; 16 MB flash, 8 MB OPI PSRAM. Custom board JSON in repo root
; (guition-jc8048w550.json). See JC8048W550_hardware_config.h.
[env:guition-jc8048w550]
extends = common
board = guition-jc8048w550
build_flags = ${common.build_flags} -D BOARD_GUITION_JC8048W550
board_build.partitions = default_16MB.csv
